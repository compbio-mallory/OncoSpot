preset_name: HGSOC_neighborhood_v1
preset_version: "0.1"
status: validation_candidate

description: >
  Candidate neighborhood-based non-malignant cell-type assignment for HGSOC.
  Exact global cell-type counts are preserved. Spatial assignment combines
  remaining abundance, local same-type neighborhood attraction, tissue-boundary
  preference, and tumor-interface preference. Coefficients are provisional
  simulation parameters and are not biological estimates.

cell_types:
  T_cell:
    fraction: 0.30
    neighbor_weight: 1.0
    boundary_weight: 0.0
    tumor_interface_weight: 0.5

  myeloid_macrophage:
    fraction: 0.25
    neighbor_weight: 0.7
    boundary_weight: 0.0
    tumor_interface_weight: 1.0

  fibroblast:
    fraction: 0.20
    neighbor_weight: 1.0
    boundary_weight: 0.3
    tumor_interface_weight: 1.0

  endothelial:
    fraction: 0.10
    neighbor_weight: 0.8
    boundary_weight: 0.3
    tumor_interface_weight: 0.3

  B_plasma:
    fraction: 0.10
    neighbor_weight: 1.3
    boundary_weight: 0.0
    tumor_interface_weight: 0.2

  normal_epithelial:
    fraction: 0.05
    neighbor_weight: 0.8
    boundary_weight: 1.0
    tumor_interface_weight: -0.5

spatial:
  mode: neighborhood_growth_v1
  k_neighbors: 12
  initial_seed_top_interface_fraction: 0.20
  exact_target_counts: true

provenance:
  fraction_source: provisional_software_default
  spatial_coefficients: provisional_validation_parameters
  calibration_status: pending_public_HGSOC_spatial_reference
