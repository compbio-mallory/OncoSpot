preset_name: HGSOC_default
preset_version: '0.2'
status: active_spatial_model
description: Broad non-malignant HGSOC cell classes. Exact global cell-type abundances
  are preserved. Spatial placement uses the validated neighborhood_growth_v1 model,
  combining remaining global abundance, local same-type neighborhood enrichment, outer-tissue
  boundary preference, and tumor-interface proximity. Cell-type abundance fractions
  remain provisional pending external HGSOC calibration.
cell_types:
  T_cell:
    fraction: 0.3
    neighbor_weight: 1.0
    boundary_weight: 0.0
    tumor_interface_weight: 0.5
  myeloid_macrophage:
    fraction: 0.25
    neighbor_weight: 0.7
    boundary_weight: 0.0
    tumor_interface_weight: 1.0
  fibroblast:
    fraction: 0.2
    neighbor_weight: 1.0
    boundary_weight: 0.3
    tumor_interface_weight: 1.0
  endothelial:
    fraction: 0.1
    neighbor_weight: 0.8
    boundary_weight: 0.3
    tumor_interface_weight: 0.3
  B_plasma:
    fraction: 0.1
    neighbor_weight: 1.3
    boundary_weight: 0.0
    tumor_interface_weight: 0.2
  normal_epithelial:
    fraction: 0.05
    neighbor_weight: 0.8
    boundary_weight: 1.0
    tumor_interface_weight: -0.5
spatial:
  mode: neighborhood_growth_v1
  k_neighbors: 12
  initial_seed_top_interface_fraction: 0.2
  exact_target_counts: true
provenance:
  fraction_source: provisional_software_default
  spatial_model_validation:
    date: 2026-10-08
    random_baseline: random_exact_counts
    previous_model: type_specific_patches
    selected_model: neighborhood_growth_v1
    observed_same_type_knn_enrichment_range:
      minimum: 1.13
      maximum: 1.49
  spatial_coefficients:
    status: provisional_simulation_parameters
    biological_estimate: false
  calibration_status: pending_public_HGSOC_spatial_reference
